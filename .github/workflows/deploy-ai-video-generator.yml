name: Deploy to Production (ai-video-generator)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    permissions: 
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        shell: bash

      - name: Build with Gradle
        run: ./gradlew clean build
        env: ${{ secrets }}

      - name: Get current time
        uses: josStorer/get-current-time@v2.1.2
        id: current-time
        with:
          format: YYYY-MM-DDTHH-mm-ss
          utcOffset: "+09:00"

      - name: Set artifact
        run: echo "artifact=$(ls ./services/ai-video-generator/build/libs/*.jar)" >> $GITHUB_ENV

      - name: Copy JAR to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOME_SERVER_HOST }}
          username: ${{ secrets.HOME_SERVER_USER }}
          key: ${{ secrets.HOME_SERVER_SSH_KEY }}
          port: ${{ secrets.HOME_SERVER_PORT }}
          source: ${{ env.artifact }}
          target: "/opt/lifepuzzle/ai-video-generator/"

      - name: SSH into Home Server and Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOME_SERVER_HOST }}
          username: ${{ secrets.HOME_SERVER_USER }}
          key: ${{ secrets.HOME_SERVER_SSH_KEY }}
          port: ${{ secrets.HOME_SERVER_PORT }}
          script: |
            echo "Deploying ai-video-generator..."
            
            # Create application directories with proper permissions
            sudo mkdir -p /opt/lifepuzzle/ai-video-generator
            sudo mkdir -p /var/log/lifepuzzle
            sudo mkdir -p /var/tmp/ai_video
            
            # Set ownership to current user for deployment
            sudo chown -R $USER:$USER /opt/lifepuzzle/ai-video-generator
            sudo chown -R $USER:$USER /var/log/lifepuzzle
            sudo chown -R $USER:$USER /var/tmp/ai_video
            
            # Stop existing service if running
            sudo systemctl stop ai-video-generator || true
            
            # Wait for service to stop
            sleep 5
            
            # Set up JAR file
            cd /opt/lifepuzzle/ai-video-generator
            rm -f ai-video-generator.jar
            mv services/ai-video-generator/build/libs/*.jar ai-video-generator.jar
            chmod +x ai-video-generator.jar
            
            # Set proper ownership for the service user
            sudo chown -R ubuntu:ubuntu /opt/lifepuzzle/ai-video-generator
            sudo chown -R ubuntu:ubuntu /var/log/lifepuzzle  
            sudo chown -R ubuntu:ubuntu /var/tmp/ai_video
            
            # Create systemd service file
            sudo tee /etc/systemd/system/ai-video-generator.service > /dev/null <<'SERVICE_EOF'
            [Unit]
            Description=AI Video Generator Service
            After=network.target
            
            [Service]
            Type=simple
            User=ubuntu
            Group=ubuntu
            WorkingDirectory=/opt/lifepuzzle/ai-video-generator
            ExecStart=/usr/bin/java -jar -Xmx2g -Dspring.profiles.active=prod ai-video-generator.jar
            Restart=always
            RestartSec=10
            StandardOutput=append:/var/log/lifepuzzle/ai-video-generator.log
            StandardError=append:/var/log/lifepuzzle/ai-video-generator-error.log
            SyslogIdentifier=ai-video-generator
            
            # Security settings
            NoNewPrivileges=true
            PrivateTmp=true
            ProtectSystem=strict
            ReadWritePaths=/opt/lifepuzzle/ai-video-generator /var/log/lifepuzzle /var/tmp/ai_video
            
            # Environment variables (will be set via EnvironmentFile)
            SERVICE_EOF
            
            # Create environment file for secrets
            sudo tee /opt/lifepuzzle/ai-video-generator/app.env > /dev/null <<ENV_EOF
            DATABASE_URL=${{ secrets.DB_PROD_URL }}
            DATABASE_USERNAME=${{ secrets.DB_PROD_USERNAME }}
            DATABASE_PASSWORD=${{ secrets.DB_PROD_PASSWORD }}
            RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }}
            RABBITMQ_PORT=${{ secrets.RABBITMQ_PORT }}
            RABBITMQ_USERNAME=${{ secrets.RABBITMQ_USERNAME }}
            RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
            AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}
            AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}
            AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AI_VIDEO_OUTPUT_PATH=${{ secrets.AI_VIDEO_OUTPUT_PATH }}
            SERVER_PORT=9001
            ENV_EOF
            
            # Add EnvironmentFile to systemd service
            sudo sed -i '/SyslogIdentifier=ai-video-generator/a EnvironmentFile=/opt/lifepuzzle/ai-video-generator/app.env' /etc/systemd/system/ai-video-generator.service
            
            # Set secure permissions for environment file
            sudo chown ubuntu:ubuntu /opt/lifepuzzle/ai-video-generator/app.env
            sudo chmod 600 /opt/lifepuzzle/ai-video-generator/app.env
            
            # Create log files with proper permissions
            sudo touch /var/log/lifepuzzle/ai-video-generator.log
            sudo touch /var/log/lifepuzzle/ai-video-generator-error.log
            sudo chown ubuntu:ubuntu /var/log/lifepuzzle/ai-video-generator*.log
            sudo chmod 644 /var/log/lifepuzzle/ai-video-generator*.log
            
            # Reload systemd and start service
            sudo systemctl daemon-reload
            sudo systemctl enable ai-video-generator
            sudo systemctl start ai-video-generator
            
            # Wait for service to start
            sleep 15
            
            # Check service status and logs for debugging
            echo "=== Service Status ==="
            sudo systemctl status ai-video-generator --no-pager -l
            echo ""
            echo "=== Recent Logs ==="
            sudo journalctl -u ai-video-generator --no-pager -n 20
            echo ""
            echo "=== Application Logs ==="
            tail -n 10 /var/log/lifepuzzle/ai-video-generator.log 2>/dev/null || echo "No application logs yet"
            echo ""
            echo "=== Port Check ==="
            sudo netstat -tlnp | grep :9001 || echo "Port 9001 not yet bound"
            echo ""
            echo "=== Deployment Summary ==="
            echo "JAR file: $(ls -la /opt/lifepuzzle/ai-video-generator/*.jar 2>/dev/null || echo 'JAR file not found')"
            echo "Environment file: $(ls -la /opt/lifepuzzle/ai-video-generator/app.env 2>/dev/null || echo 'Environment file not found')"
            echo "Deployment completed successfully!"
